# Được image nginx chạy qua envsubst lúc khởi động (/etc/nginx/templates):
# ${BACKEND_UPSTREAM} được thay bằng biến môi trường (mặc định backend:3000 — xem Dockerfile).
# Các biến của nginx ($uri, $host...) không bị đụng tới vì không phải biến môi trường.

# Giữ nguyên giao thức gốc (https) khi phía trước còn một proxy khác (Caddy / Cloudflare Tunnel).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# WebSocket: chỉ gửi "Connection: upgrade" khi trình duyệt thực sự xin nâng cấp.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # DNS lấy từ /etc/resolv.conf của container (trong docker-compose = DNS nội bộ Docker) — để nginx vẫn khởi động được kể cả khi backend chưa lên,
  # và tự tìm lại backend sau khi container backend được tạo lại (đổi IP).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $backend http://${BACKEND_UPSTREAM};

  # Nén file trước khi gửi → trang tải nhanh hơn (bundle JS ~2MB còn ~1/4).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Không cho nhúng trang vào web khác, chặn trình duyệt đoán sai kiểu file.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ─── Chuyển sang backend ────────────────────────────────────────────────
  # "^~" = ưu tiên hơn các khối ảnh/JS bên dưới, để /api/.../anh.png không bị coi là file tĩnh.

  # API REST
  location ^~ /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    # Upload video phòng họp tối đa 500MB (RECORDING_VIDEO_UPLOAD_MAX_BYTES) → để dư 520MB.
    client_max_body_size 520m;
    # Truyền thẳng (không gom vào ổ đĩa của nginx): upload lớn, tải MP4 xem lại tới ~2GB, HLS.
    proxy_request_buffering off;
    proxy_buffering off;
    # Xuất báo cáo / xử lý lâu — không cắt giữa chừng (backend tự giới hạn thời gian riêng).
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
  }

  # WebSocket (thông báo thời gian thực, phòng họp) — socket.io path /ws
  location ^~ /ws/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    # Kết nối giữ lâu; socket.io tự ping mỗi ~25s nên 1 giờ là dư.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Ảnh đại diện lưu local (backend serve /uploads/avatars)
  location ^~ /uploads/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  # ─── Giao diện web (file tĩnh) ──────────────────────────────────────────

  # index.html luôn hỏi lại server → deploy bản mới là người dùng nhận ngay, không kẹt bản cũ.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # File JS/CSS trong /static có mã băm trong tên → cache lâu thoải mái.
  location ^~ /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Ảnh/font khác (không có mã băm) → cache 7 ngày; thiếu file thì trả 404 thay vì trang HTML.
  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|glb|gltf)$ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
